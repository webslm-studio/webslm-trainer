[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webslm-trainer"
version = "0.1.0"
description = "A small desktop and CLI LoRA trainer for text, audio, and video SLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "WebSLM Studio"}]
dependencies = []

[project.optional-dependencies]
train = ["trl[peft]>=0.26,<2", "datasets>=3,<5", "accelerate>=1,<2", "transformers>=5,<6"]

[project.scripts]
webslm-trainer = "webslm_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["webslm_trainer*"]
